name: Atualizar vagas automaticamente

on:
  push:
    branches: [main]
    paths:
      - "collect_jobs.py"
      - "src/matcher.py"
      - "app.py"
      - "test_matcher.py"
      - ".github/workflows/collect-jobs.yml"
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Testar filtros e compatibilidade
        run: python -m pytest -q
      - name: Coletar vagas
        run: python collect_jobs.py
      - name: Salvar feed atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/jobs_feed.json
          git diff --cached --quiet || git commit -m "chore: atualizar feed de vagas"
          git push
