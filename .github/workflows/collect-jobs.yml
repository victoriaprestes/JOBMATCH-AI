name: Atualizar vagas automaticamente

on:
  push:
    branches: [main]
    paths:
      - "collect_jobs.py"
      - "src/matcher.py"
      - "app.py"
      - "test_matcher.py"
      - ".github/workflows/collect-jobs.yml"
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

concurrency:
  group: jobmatch-collect-jobs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Testar filtros e compatibilidade
        run: |
          python -m pytest -q
          python -m py_compile app.py collect_jobs.py src/matcher.py
      - name: Coletar vagas
        run: python collect_jobs.py
      - name: Salvar feed atualizado
        run: |
          cp data/jobs_feed.json /tmp/jobs_feed.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp /tmp/jobs_feed.json data/jobs_feed.json
            git add -f data/jobs_feed.json
            if git diff --cached --quiet; then
              echo "Feed já está atualizado."
              exit 0
            fi
            git commit -m "chore: atualizar feed de vagas"
            if git push; then
              exit 0
            fi
            echo "Push concorrente; tentando novamente ($attempt/3)."
            sleep 2
          done
          exit 1
